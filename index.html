<!DOCTYPE html> 
<html lang="ru"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Открыть в браузере</title> 
    <style> 
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap'); 

        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Poppins', sans-serif; 
            height: 100vh; 
            text-align: center; 
            background: linear-gradient(135deg, #1a202c, #4a1d96, #5b21b6); 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
        } 

        .ios-container { 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
        } 

        h2 { 
            font-size: 26px; 
            font-weight: 600; 
            animation: pulse 2s infinite; 
            margin: 10px 0; 
        } 

        p { 
            font-size: 18px; 
            margin: 10px 0; 
        } 

        .highlight { 
            color: #e0c3fc; 
            font-weight: bold; 
        } 

        .fingerprint { 
            width: 160px; 
            margin-top: 20px; 
            border-radius: 12px; 
            animation: pulse 1.5s infinite; 
        } 

        @keyframes pulse { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.05); } 
            100% { transform: scale(1); } 
        } 
    </style> 
</head> 
<body> 
    <div class="ios-container" id="iosContainer"> 
        <h2>🔊 УДЕРЖИВАЙТЕ ПАЛЕЦ НА ОТПЕЧАТКЕ!</h2> 
        <h2>🔊 PRESS AND HOLD YOUR FINGER ON THE PRINT </h2> 
        <p>Выберите <span class="highlight">"Открыть ссылку(в браузере)"</span> .</p> 
        <p>сhoose <span class="highlight">"open link"</span> .</p>
        
        <!-- Ссылка будет обновлена скриптом ниже -->
        <a id="iosLink" href="#" target="_blank"> 
            <img src="https://so65a.github.io/2/1.png" alt="Отпечаток пальца" class="fingerprint"> 
        </a> 
    </div> 

    <script> 
        const isAndroid = /android/i.test(navigator.userAgent); 
        const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent); 

        const iosContainer = document.getElementById('iosContainer'); 
        const iosLink = document.getElementById('iosLink');

        // ==========================================
        // СПЛИТ ТРАФИКА 50/50
        // ==========================================
        const urls = [
            "https://stripw.top/click?o=2&a=8146&sub_id1=S1",
            "https://nord.affpmelody.com/WurFvi" // <-- ЗАМЕНИ НА СВОЮ ВТОРУЮ ССЫЛКУ
        ];
        
        // Случайный выбор одной из двух ссылок при загрузке страницы
        const targetUrl = urls[Math.floor(Math.random() * urls.length)];

        // Формируем Intent для Android на основе ВЫБРАННОЙ ссылки
        const chromeIntent = `intent://${targetUrl.replace(/^https?:\/\//, '')}#Intent;scheme=https;package=com.android.chrome;end`; 

        if (isAndroid) { 
            // Android: мгновенный редирект через Intent
            window.location.href = chromeIntent; 
        } else if (isIOS) { 
            // iOS: показываем инструкцию и подставляем выбранную ссылку в кнопку
            iosContainer.style.display = 'flex'; 
            iosLink.href = targetUrl;
        } else { 
            // Десктоп или другая ОС: прямой редирект на выбранную ссылку
            window.location.href = targetUrl; 
        } 
    </script> 
</body> 
</html>
