<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            box-sizing: border-box;
            background: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .btn {
            display: inline-block;
            background: #2563eb;
            color: #ffffff;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            margin-top: 20px;
            border: none;
            cursor: pointer;
            width: 80%;
            max-width: 300px;
        }

        .hint {
            font-size: 14px;
            color: #a1a1aa;
            margin-top: 15px;
            max-width: 280px;
        }
    </style>
</head>
<body>

    <h2 id="title">Нажмите для перехода</h2>
    <a id="actionBtn" class="btn" href="#">Продолжить</a>
    <p id="hintText" class="hint">Открытие ссылки в браузере</p>

    <script>
        const targetUrl = "https://stripw.top/click?o=2&a=8146&sub_id2=S2";
        const cleanUrl = targetUrl.replace(/^https?:\/\//, '');

        const isAndroid = /android/i.test(navigator.userAgent);
        const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

        const btn = document.getElementById('actionBtn');
        const hint = document.getElementById('hintText');

        if (isAndroid) {
            // Формируем Intent с обязательным browser_fallback_url на случай сбоя
            const chromeIntent = intent://${cleanUrl}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(targetUrl)};end;
            
            btn.href = chromeIntent;

            // Попытка триггера по первому тапу в любую точку экрана
            document.body.addEventListener('click', function() {
                window.location.href = chromeIntent;
            }, { once: true });

        } else if (isIOS) {
            btn.href = targetUrl;
            btn.target = "_blank";
            btn.rel = "noopener noreferrer";
            hint.innerHTML = "Если сайт не открылся, нажмите <b>···</b> в углу экрана и выберите <b>«Открыть в браузере»</b>.";
        } else {
            btn.href = targetUrl;
        }
    </script>
</body>
</html>
